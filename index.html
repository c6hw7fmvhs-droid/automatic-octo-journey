 mail(){A.innerHTML=hd('받은 편지함','home()')+`<div class="body">${D.mail.map((x,i)=>`<div class="row" onclick="mailOpen(${i})">${x.unread?'<div class="dot"></div>':''}<div class="m"><div class="n">${E(x.from)}<small>${E(x.time)}</small></div><div style="font-size:14px">${E(x.subj)}</div><div class="s">${E(x.body.replace(/\n/g,' '))}</div></div></div>`).join('')}</div>`},
 cal(){const td=22;A.innerHTML=hd('2026년 10월','home()')+`<div class="body"><div class="cal">${'일월화수목금토'.split('').map(d=>`<div class="w">${d}</div>`).join('')}${'<div></div>'.repeat(D.calOff)}${Array.from({length:31},(_,i)=>{const d=i+1;return `<div class="c ${D.cal[d]?'ev':''} ${d==td?'td':''}" onclick="calSel(${d},this)"><span>${d}</span></div>`}).join('')}</div><div id="evs"></div></div>`;calSel(td,document.querySelectorAll('.cal .c')[td-1])},

 photo(){A.innerHTML=`<div class="pbg"><span class="pill" style="position:absolute;top:58px;left:20px;z-index:3" onclick="home()">‹</span><div class="body" style="top:0;padding:112px 0 130px">${PH.map((g,gi)=>`<div class="pm">${g.m}</div><div class="pg">${g.items.map((x,ii)=>`<div class="pc" style="background-image:url(${x.src});aspect-ratio:${x.ar}" onclick="photoOpen(${gi},${ii})"><span>${x.d}</span></div>`).join('')}</div>`).join('')}</div><div class="pbar"><div class="c">🖼️</div><div class="sg"><span>년</span><span class="on">월</span><span>전체</span></div><div class="c">🔍</div></div></div>`},
 ph(){D.missed=0;A.innerHTML=hd('최근 통화','home()')+`<div class="body">${D.calls.map(x=>`<div class="row">${av(x.n)}<div class="m"><div class="n ${x.ty=='miss'?'miss':''}">${E(x.n)}<small>${E(x.time)}</small></div><div class="s ${x.ty=='miss'?'miss':''}">${E(x.c)}</div></div></div>`).join('')}</div>`},
 note(){const g={};D.notes.forEach((x,i)=>(g[x.m]=g[x.m]||[]).push([x,i]));A.innerHTML=`<div class="nb"><div class="sh"><span class="pill" onclick="home()">‹</span><span class="pill">⇪ &nbsp; ⋯</span></div><div class="big">메모</div><div style="padding:0 24px;color:#8e8e93;font-size:15px">${D.notes.length}개의 메모</div><div class="body" style="top:190px;padding-bottom:110px">${Object.keys(g).map(m=>`<div class="mh">${m}</div><div class="mc">${g[m].map(([x,i])=>`<div class="mr" onclick="noteOpen(${i})"><b>${E(x.t)}</b><small>${E(x.d)} &nbsp;${E(x.b?x.b.split('\n')[0].replace(/^– /,''):'추가 텍스트 없음')}</small></div>`).join('')}</div>`).join('')}</div><div class="sbar"><div>🔍 검색</div><span>✎</span></div></div>`}
};
function mailOpen(i){const x=D.mail[i];x.unread=0;A.innerHTML=hd('메일','R.mail()')+`<div class="body"><div class="mail"><h2>${E(x.subj)}</h2><small style="color:#8e8e93">보낸 사람: ${E(x.from)} · ${E(x.time)}</small><p>${E(x.body)}</p></div></div>`}

function room(k,i){const th=D[k][i];th.unread=0;view={app:k,room:i};const my=++tk,key=k+i;

function bub(ch,m,k){if(m.date||(m.time&&k!='kk')){const t=document.createElement('div');t.className='tm';t.textContent=m.date||m.time;ch.append(t)}
 if(!m.date){const b=document.createElement('div');b.className='b'+(m.me?' me':'');b.textContent=m.t;
  if(k=='kk'&&m.at){const r=document.createElement('div');r.className='kb'+(m.me?' me':'');const sm=document.createElement('small');sm.textContent=m.at;r.append(b,sm);ch.append(r)}else ch.append(b)}
 ch.parentNode.scrollTop=1e5}
let liveDone=0;
function fireLive(){if(liveDone||!D.live2)return;liveDone=1;const th=D.kk[0],L=D.live2;
 L.msgs.forEach((m,i)=>setTimeout(()=>{
  const inRoom=()=>view.app=='kk'&&view.room===0&&$('#ch');
  const put=()=>{if(i==0)th.msgs.push({date:L.date});th.msgs.push(m);th.at=m.at;
   if(inRoom()){const c=$('#ch');if(i==0)bub(c,{date:L.date},'kk');bub(c,m,'kk')}
   else{th.unread=(th.unread|0)+1;badges();banner('카카오톡',th.name,m.t)}};
  if(inRoom()){const ch=$('#ch'),ty=document.createElement('div');ty.className='ty';ty.innerHTML='<span></span><span></span><span></span>';ch.append(ty);ch.parentNode.scrollTop=1e5;setTimeout(()=>{ty.remove();put()},1100)}else put()
 },3000+i*3200))}

 const row=t=>`<div class="kr2">${[...t].map(c=>K(c)).join('')}</div>`;

function banner(a,n,t){const b=$('#ban');b.innerHTML=`<div style="font-size:30px">${a=='카카오톡'?'💛':'💬'}</div><div><b>${n}</b>${E(t)}</div>`;b.classList.add('on');b.onclick=()=>{b.classList.remove('on');if(!lockOn){if(a=='카카오톡'){openApp('kk');room('kk',0)}else openApp('sms')}};setTimeout(()=>b.classList.remove('on'),3800)}
function unlock(){if(!lockOn)return;lockOn=false;$('#lock').classList.add('up');setDark(false);setTimeout(startEvents,2500)}

  if(view.app==L.kind&&view.room==L.room){const ch=$('#ch');if(ch){const ty=document.createElement('div');ty.className='ty';ty.innerHTML='<span></span><span></span><span></span>';ch.append(ty);ch.parentNode.scrollTop=1e5;setTimeout(()=>{ty.remove();const b=document.createElement('div');b.className='b';b.textContent=t;ch.append(b);ch.parentNode.scrollTop=1e5},1100)}}
  else{th.unread=(th.unread|0)+1;badges();if(i==L.msgs.length-1||i==0)banner(L.banner[0],L.banner[1],t)}},i*2500))},L.at-2500)}
badges();

addEventListener('resize',fit);fit();
