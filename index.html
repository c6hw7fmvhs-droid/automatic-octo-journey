<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story Phone</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="phone" data-theme="light">
  <section id="welcome" aria-label="시작하기">
    <div class="welcome-card">
      
      <h1>어떻게 불러 줄까?</h1>
      <p class="welcome-copy">지우가 너를 부를 이름을 알려 줘.</p>
      <form id="welcome-form" autocomplete="off">
        <label for="welcome-name">이름 또는 별명</label>
        <input id="welcome-name" name="name" maxlength="20" placeholder="이름을 입력해 줘" required>
        <button type="submit">시작하기</button>
      </form>
      <p class="welcome-foot">새로고침하면 처음부터 다시 시작해.</p>
    </div>
  </section>
  <div id="statusbar">
    <span id="sb-time"></span><i class="island"></i>
    <span class="sb-right">
      <svg class="sig" viewBox="0 0 20 14"><rect x="0" y="9" width="3.5" height="5" rx="1"/><rect x="5.5" y="6" width="3.5" height="8" rx="1"/><rect x="11" y="3" width="3.5" height="11" rx="1"/><rect x="16.5" y="0" width="3.5" height="14" rx="1" class="dim"/></svg>
      <svg class="wifi" viewBox="0 0 20 14"><circle cx="10" cy="11.8" r="1.7"/><path d="M5.6 8.2a6.2 6.2 0 0 1 8.8 0M2.4 5a10.6 10.6 0 0 1 15.2 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <b class="batt">97</b>
    </span>
  </div>

  <section id="lock" class="screen">
    <div class="lock-top"><div id="lock-date"></div><div id="lock-time"></div></div>
    <div id="notifs"></div>
    <div class="lock-hint">위로 스와이프(또는 클릭)하여 열기</div>
  </section>

  <section id="home" class="screen" hidden>
    <div id="home-grid"></div>
    <div id="dock"></div>
  </section>

  <section id="messages" class="screen app" hidden>
    <div id="msg-listview" class="view">
      <div class="topbtns"><button class="pill" id="msg-home">‹ 홈</button><span class="pill round" aria-hidden="true">≡</span></div>
      <div class="body"><h1 class="big">메시지</h1><div id="msg-list"></div></div>
    </div>
    <div id="msg-chatview" class="view" hidden>
      <div class="topbtns"><button class="pill round" id="msg-back" aria-label="뒤로">‹</button><span class="pill namepill" id="chat-name"></span><span class="spacer"></span></div>
      <div id="chat-body" class="body"></div>
      <form id="msg-form" autocomplete="off">
        <label class="attach" aria-label="사진 보내기">+<input type="file" id="msg-file" accept="image/*" hidden></label>
        <div class="inwrap"><textarea id="msg-input" rows="1" maxlength="500" placeholder="문자 메시지" enterkeyhint="send"></textarea><button type="button" id="msg-clear" aria-label="입력 취소" hidden>×</button></div>
        <button type="submit" id="msg-send" aria-label="전송">↑</button>
      </form>
    </div>
  </section>

  <section id="camera-app" class="screen" hidden>
    <video id="cam-video" playsinline muted autoplay></video>
    <div id="cam-msg" hidden></div>
    <div id="cam-flash"></div>
    <div class="cam-bar">
      <button id="cam-thumb" aria-label="마지막 사진"></button>
      <button id="cam-shutter" aria-label="사진 찍기"><span></span></button>
      <button id="cam-flip" aria-label="카메라 전환">⟲</button>
    </div>
    <input type="file" id="cam-file" accept="image/*" capture="environment" hidden>
    <div id="cam-view" hidden>
      <div class="topbtns"><button class="pill" id="cv-close">닫기</button><span class="pill" id="cv-count"></span><button class="pill" id="cv-del">삭제</button></div>
      <img id="cv-img" alt="찍은 사진">
      <div class="cv-nav"><button id="cv-prev" aria-label="이전">‹</button><button id="cv-next" aria-label="다음">›</button></div>
    </div>
  </section>

  <section id="calendar-app" class="screen app" hidden>
    <div class="cal-toolbar"><button id="cal-home" class="cal-year"><span>‹</span> 2026년</button><div class="cal-tools"><button aria-label="보기">▤</button><button aria-label="검색">⌕</button><button aria-label="추가">＋</button></div></div>
    <div class="body cal-body">
      <div class="cal-monthline"><h1 id="cal-title"></h1><div class="cal-monthnav"><button id="cal-prev" aria-label="이전 달">‹</button><button id="cal-next" aria-label="다음 달">›</button></div></div>
      <div class="calwk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="cal-grid"></div>
      <div id="cal-events"></div>
    </div>
    <div class="cal-bottom"><button id="cal-today">오늘</button><div><button aria-label="캘린더">▦</button><button aria-label="받은 편지함">▱</button></div></div>
  </section>

  <section id="photos" class="screen app" hidden>
    <div class="body"><h1 class="big">보관함</h1><div id="photo-list"></div></div>
    <div id="photo-detail" class="detail" hidden>
      <div class="topbtns"><button class="pill" id="pd-close">‹ 보관함</button></div>
      <div id="pd-pic"></div><div id="pd-info"></div>
    </div>
  </section>

  <section id="instagram" class="screen app" hidden></section>

  <section id="kakao" class="screen app kakao-app" hidden>
    <div id="kakao-listview" class="kakao-view">
      <header class="kakao-header"><h1>채팅</h1><div class="kakao-head-icons"><button aria-label="검색"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button aria-label="새 채팅"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button><button aria-label="설정"><svg viewBox="0 0 24 24"><path d="M12 3l2 1 2-.5 1.5 2 2 .8v2.4l1.2 1.8-1.2 2 .1 2.3-2.1 1-1.2 2-2.3-.4-2 1-1.6-1.6-2.3-.2-.7-2.2-1.8-1.4.5-2.3-1-2 1.6-1.7.1-2.3 2.2-.6z"/><circle cx="12" cy="11.5" r="3"/></svg></button></div></header>
      <div class="kakao-tabs"><span class="active">전체</span><span>안읽음</span><span>통화</span><span class="filter-tab" aria-label="필터">☰</span></div>
      <div id="kakao-list" class="kakao-list"></div>
      <nav class="kakao-bottom"><span aria-label="친구"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg></span><span class="active" aria-label="채팅"><svg viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 4z"/></svg><i>321</i></span><span aria-label="콘텐츠"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg></span><span aria-label="쇼핑"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 13H5zM8 8V6a4 4 0 0 1 8 0v2"/></svg></span><span aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span></nav>
    </div>
    <div id="kakao-chatview" class="kakao-view" hidden>
      <header class="kakao-chat-header"><button id="kakao-back" aria-label="뒤로">‹</button><b id="kakao-chat-title">이지우</b><div class="kakao-chat-tools"><button aria-label="검색">⌕</button><button aria-label="전화"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 2.8 9.5 2c.7-.2 1.4.2 1.6.9l1.1 3.4c.2.6 0 1.2-.5 1.6l-1.8 1.4a14 14 0 0 0 4.8 4.8l1.4-1.8c.4-.5 1-.7 1.6-.5l3.4 1.1c.7.2 1.1.9.9 1.6l-.8 2.9c-.2.7-.9 1.2-1.6 1.2C10.4 18.6 5.4 13.6 5.4 7c0-.7.5-1.4 1.2-1.6Z"/></svg></button><button aria-label="메뉴">☰</button></div></header>
      <div id="kakao-chat-body" class="kakao-chat-body"></div>
      <div id="kakao-suggestions" class="kakao-suggestions"></div>
      <form id="kakao-form"><button type="button" class="kakao-plus" aria-label="추가">＋</button><input id="kakao-input" placeholder="메시지 입력" autocomplete="off"><button type="button" class="kakao-emoji" aria-label="이모티콘">☻</button><button type="submit" class="kakao-send" aria-label="전송">↑</button></form>
    </div>
  </section>

  <section id="phone-app" class="screen app" hidden>
    <div class="topbtns"><button class="pill" id="call-home">‹ 홈</button><span class="pill" aria-hidden="true">편집</span></div>
    <div class="body"><h1 class="big">최근 통화</h1><div id="call-list"></div></div>
    <div class="tabbar" aria-hidden="true"><span>즐겨찾기</span><span class="on">최근 통화</span><span>연락처</span><span>키패드</span></div>
  </section>

  <button id="homebar" aria-label="홈 화면" hidden><span></span></button>
</div>

<script src="data/characters.js"></script>
<script src="data/conversations.js"></script>
<script src="data/config.js"></script>
<script src="data/posts.js"></script>
<script src="data/photos.js"></script>
<script src="data/calls.js"></script>
<script src="data/notifications.js"></script>
<script src="data/calendar.js"></script>
<script src="js/storage.js"></script>
<script src="js/events.js"></script>
<script src="js/navigation.js"></script>
<script src="js/replies.js"></script>
<script src="js/ai.js"></script>
<script src="js/messages.js"></script>
<script src="js/instagram.js"></script>
<script src="js/kakao.js"></script>
<script src="js/photos.js"></script>
<script src="js/phone.js"></script>
<script src="js/camera.js"></script>
<script src="js/calendar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
